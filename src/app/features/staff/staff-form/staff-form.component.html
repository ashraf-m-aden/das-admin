<div class="das-staff-form">
  <h1>{{ (editingId ? 'staff.editStaff' : 'staff.addStaff') | transloco }}</h1>

  <form class="das-staff-form__form das-card" [formGroup]="form" (ngSubmit)="submit()">
    <label class="das-staff-form__field">
      <span>{{ 'staff.login' | transloco }}</span>
      <input type="text" formControlName="login" />
    </label>

    <div class="das-staff-form__row">
      <label class="das-staff-form__field">
        <span>{{ 'staff.firstName' | transloco }}</span>
        <input type="text" formControlName="firstName" />
      </label>
      <label class="das-staff-form__field">
        <span>{{ 'staff.lastName' | transloco }}</span>
        <input type="text" formControlName="lastName" />
      </label>
    </div>

    <label class="das-staff-form__field">
      <span>{{ 'staff.email' | transloco }}</span>
      <input type="email" formControlName="email" />
    </label>

    <label class="das-staff-form__field">
      <span>{{ 'staff.phone' | transloco }}</span>
      <input type="tel" formControlName="phone" />
    </label>

    <label class="das-staff-form__field">
      <span>{{ 'staff.role' | transloco }}</span>
      <select formControlName="role">
        @for (role of roles; track role) {
          <option [value]="role">{{ 'role.' + role | transloco }}</option>
        }
      </select>
    </label>

    @if (errorMessageKey$ | async; as errorKey) {
      <p class="das-staff-form__error" role="alert">{{ errorKey | transloco }}</p>
    }

    <button type="submit" class="das-staff-form__submit" [disabled]="(isSaving$ | async) || form.invalid">
      {{ (isSaving$ | async) ? ('common.loading' | transloco) : ('common.save' | transloco) }}
    </button>
  </form>
</div>
