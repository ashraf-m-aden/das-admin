<das-page-header [eyebrow]="'blocks.eyebrow' | transloco" [title]="'nav.blocks' | transloco">
  <div actions class="view-toggle">
    <a class="view-toggle__btn" routerLink="/blocks"><i class="ti ti-list" aria-hidden="true"></i>{{ 'blocks.viewList' |
      transloco }}</a>
    <span class="view-toggle__btn view-toggle__btn--active"><i class="ti ti-map-2" aria-hidden="true"></i>{{
      'blocks.viewMap' | transloco }}</span>
  </div>
</das-page-header>

<div class="map-wrap">
  <das-hierarchy-cascade [showZoneHighlight]="true" (selectionChange)="onHierarchy($event)" (zoneHighlightChange)="onZoneHighlight($event)" />
  <das-map [features]="mapFeatures()" [layers]="mapLayers" [tileLayers]="tileLayers" [tileFilters]="tileFilters()" [tileFillColors]="tileFillColors()"
    [basemapLayers]="basemapLayers" [fitBbox]="selectedBbox()" (featureSelect)="onSelect($event)" />
  <div class="map-legend">
    <button type="button" class="map-legend__item map-legend__item--btn" [class.map-legend__item--on]="statusFilter() === null" (click)="filterStatus(null)">{{ 'blocks.filterAll' | transloco }}</button>
    @for (st of legend; track st) {
      <button type="button" class="map-legend__item map-legend__item--btn" [class.map-legend__item--on]="statusFilter() === st" (click)="filterStatus(st)">
        <span class="map-legend__dot" [style.background]="legendColor(st)"></span>{{ statusLabelKey(st) | transloco }}
      </button>
    }
  </div>
</div>
