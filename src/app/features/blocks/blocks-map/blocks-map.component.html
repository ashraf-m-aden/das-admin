<div class="das-blocks-map-wrapper">
  <div #mapContainer class="das-blocks-map"></div>

  @if (initError()) {
    <div class="das-blocks-map-error">
      <p>Impossible d'afficher la carte : le navigateur a refusé de créer un contexte graphique WebGL.</p>
      <p>Ferme complètement cet onglet et rouvre la page — cela résout généralement le problème.</p>
    </div>
  }
</div>
