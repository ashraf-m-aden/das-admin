<das-page-header [eyebrow]="(('notifications.unreadCount' | transloco: { count: ((unreadCount$ | async) ?? 0) }))" [title]="'nav.notifications' | transloco" feature="notifications">
  <button actions type="button" class="nt-mark" (click)="markAllAsRead()"><i class="ti ti-checks" aria-hidden="true"></i>{{ 'notifications.markAll' | transloco }}</button>
</das-page-header>

<div class="notifs">
  <section class="das-card notifs__list">
    @for (n of (items$ | async) ?? []; track n.id) {
      <button type="button" class="notif" [class.notif--unread]="!n.readAt" (click)="open(n)">
        <span class="notif__icon" [style.background]="iconFor(n.type).bg" [style.color]="iconFor(n.type).color">
          <i class="ti {{ iconFor(n.type).icon }}" aria-hidden="true"></i>
        </span>
        <div class="notif__body">
          <div class="notif__text">{{ n.messageKey | transloco: n.messageParams }}</div>
          <div class="notif__meta">{{ n.createdAt | dasDate: 'long' }}</div>
        </div>
        @if (!n.readAt) { <span class="notif__unread-dot"></span> }
      </button>
    } @empty {
      <div class="notifs__empty">
        @if (isLoading$ | async) { {{ 'common.loading' | transloco }} } @else { {{ 'notifications.empty' | transloco }} }
      </div>
    }
  </section>
</div>
