<das-page-header
  [eyebrow]="'nav.clients' | transloco"
  [title]="(editingId ? 'clients.editTitle' : 'clients.newTitle') | transloco"
  feature="clients">
  <a actions class="cf-back" routerLink="/clients"><i class="ti ti-arrow-left" aria-hidden="true"></i>{{ 'common.back' | transloco }}</a>
</das-page-header>

<div class="cf">
  <form class="das-card cf__form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="cf__field">
      <label for="cf-login">{{ 'clients.login' | transloco }}</label>
      <input id="cf-login" type="text" formControlName="login" [attr.placeholder]="'clients.login' | transloco" />
    </div>
    <div class="cf__field">
      <label for="cf-company">{{ 'clients.companyName' | transloco }}</label>
      <input id="cf-company" type="text" formControlName="companyName" />
    </div>
    <div class="cf__field">
      <label for="cf-contact">{{ 'clients.contactName' | transloco }}</label>
      <input id="cf-contact" type="text" formControlName="contactName" />
    </div>
    <div class="cf__row">
      <div class="cf__field">
        <label for="cf-email">{{ 'clients.email' | transloco }}</label>
        <input id="cf-email" type="email" formControlName="email" />
      </div>
      <div class="cf__field">
        <label for="cf-phone">{{ 'clients.phone' | transloco }}</label>
        <input id="cf-phone" type="text" formControlName="phone" />
      </div>
    </div>
    <div class="cf__field">
      <label for="cf-plan">{{ 'clients.plan' | transloco }}</label>
      <select id="cf-plan" formControlName="planId">
        <option value="">{{ 'clients.selectPlan' | transloco }}</option>
        @for (p of (plans$ | async) ?? []; track p.id) { <option [value]="p.id">{{ p.name }}</option> }
      </select>
    </div>

    @if (errorMessageKey$ | async; as err) { <div class="cf__error">{{ err | transloco }}</div> }

    <div class="cf__actions">
      <button type="submit" class="btn btn--primary" [disabled]="(isSaving$ | async)">
        @if (isSaving$ | async) { {{ 'common.saving' | transloco }} } @else { {{ 'common.save' | transloco }} }
      </button>
      <a class="btn btn--ghost" routerLink="/clients">{{ 'common.cancel' | transloco }}</a>
    </div>
  </form>
</div>
