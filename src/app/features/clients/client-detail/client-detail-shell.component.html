@if (client$ | async; as client) {
  <das-page-header [eyebrow]="client.contactName + ' · ' + client.email" [title]="client.companyName">
    <div actions class="cd-actions">
      <a class="cd-btn" [routerLink]="['/clients', clientId, 'edit']"><i class="ti ti-pencil" aria-hidden="true"></i>{{ 'clients.edit' | transloco }}</a>
      <a class="cd-btn cd-btn--ghost" routerLink="/clients"><i class="ti ti-arrow-left" aria-hidden="true"></i>{{ 'common.back' | transloco }}</a>
    </div>
  </das-page-header>
}

<div class="cd">
  <nav class="cd__tabs">
    <a class="cd__tab" routerLink="zone-access" routerLinkActive="cd__tab--active">{{ 'clients.zoneAccess' | transloco }}</a>
    <a class="cd__tab" routerLink="api-tokens" routerLinkActive="cd__tab--active">{{ 'clients.apiTokens' | transloco }}</a>
  </nav>

  <router-outlet />
</div>
