@if (rejecting()) {
  <div class="reject" [formGroup]="rejectForm">
    <input type="text" formControlName="reason" [attr.placeholder]="'verification.reasonPlaceholder' | transloco" />
    <button type="button" class="btn btn--reject" [disabled]="rejectForm.invalid || deciding()" (click)="confirmReject()">
      {{ 'verification.confirmReject' | transloco }}
    </button>
    <button type="button" class="btn btn--ghost" (click)="cancelReject()">{{ 'common.cancel' | transloco }}</button>
  </div>
  <!-- Le motif part tel quel a l'agent : le dire evite un rejet vide, puis un aller-retour. -->
  <p class="reject__hint">{{ 'verification.reasonRequired' | transloco }}</p>
} @else if (confirmingDefinitive()) {
  <!-- Le seul moment ou l'on peut encore arreter un gel de code d'adresse est AVANT l'envoi :
       la reponse 200 ne dira rien apres coup. -->
  <div class="definitive">
    <p class="definitive__text">
      <i class="ti ti-alert-triangle" aria-hidden="true"></i>
      {{ 'verification.definitiveWarningOne' | transloco: { count: 1 } }}
    </p>
    <div class="definitive__actions">
      <button type="button" class="btn btn--definitive" [disabled]="deciding()" (click)="confirmDefinitive()">
        {{ 'verification.confirmDefinitive' | transloco }}
      </button>
      <button type="button" class="btn btn--ghost" (click)="cancelDefinitive()">{{ 'common.cancel' | transloco }}</button>
    </div>
  </div>
} @else {
  <div class="actions">
    <button type="button" class="btn btn--approve" [disabled]="deciding()" (click)="validateTemporary()">
      <i class="ti ti-check" aria-hidden="true"></i>{{ 'verification.validateTemporary' | transloco }}
    </button>
    <button type="button" class="btn btn--definitive" [disabled]="deciding()" (click)="requestDefinitive()"
            [attr.title]="'verification.definitiveHint' | transloco">
      <i class="ti ti-lock" aria-hidden="true"></i>{{ 'verification.validateDefinitive' | transloco }}
    </button>
    <button type="button" class="btn btn--reject" [disabled]="deciding()" (click)="startReject()">
      <i class="ti ti-x" aria-hidden="true"></i>{{ 'verification.reject' | transloco }}
    </button>
    <button type="button" class="btn btn--ghost" [disabled]="deciding()" (click)="requestCorrection.emit()">
      <i class="ti ti-rotate" aria-hidden="true"></i>{{ 'verification.requestCorrection' | transloco }}
    </button>
  </div>
}
