<div class="cascade">
  <select class="cascade__select" (change)="onCity($any($event.target).value)">
    <option value="">{{ 'hierarchy.allCities' | transloco }}</option>
    @for (c of cities(); track c.id) {
    <option [value]="c.id" [selected]="c.id === selection().cityId">{{ c.name }}</option>
    }
  </select>

  <select class="cascade__select" [disabled]="!selection().cityId" (change)="onCommune($any($event.target).value)">
    <option value="">{{ 'hierarchy.allCommunes' | transloco }}</option>
    @for (c of communes(); track c.id) {
    <option [value]="c.id" [selected]="c.id === selection().communeId">{{ c.name }}</option>
    }
  </select>

  <!--
    Filtre zone MULTIPLE, en cases a cocher. Un select simple obligeait a relancer la recherche
    zone par zone alors qu'on veut souvent les regarder ensemble.

    Depend de la VILLE, pas de la commune : « toutes les communes » veut dire la ville entiere,
    pas l'absence de critere. Desactive uniquement quand il n'y a reellement aucune zone, avec
    un libelle qui le dit - sinon on ne distingue pas « pas de zone ici » de « filtre casse ».
  -->
  <div class="zsel" [class.zsel--disabled]="!selection().cityId || zones().length === 0">
    <button type="button" class="zsel__button" [disabled]="!selection().cityId || zones().length === 0"
            [attr.aria-expanded]="zonesOpen()" (click)="toggleZonesPanel()">
      <span class="zsel__label">{{ zoneButtonLabel() | transloco: { count: selection().zoneIds.length } }}</span>
      <i class="ti" [class.ti-chevron-down]="!zonesOpen()" [class.ti-chevron-up]="zonesOpen()" aria-hidden="true"></i>
    </button>

    @if (zonesOpen()) {
      <div class="zsel__panel" role="group">
        <label class="zsel__row">
          <input type="checkbox" [checked]="selection().zoneIds.length === 0" (change)="clearZones()" />
          <span>{{ 'hierarchy.allZones' | transloco }}</span>
        </label>
        @for (z of zones(); track z.id) {
          <label class="zsel__row" [class.zsel__row--on]="isZoneSelected(z.id)">
            <input type="checkbox" [checked]="isZoneSelected(z.id)" (change)="onToggleZone(z.id)" />
            <span>{{ z.name }}</span>
          </label>
        }
      </div>
    }
  </div>

  <!-- Mise en évidence par zone : multi-sélection, à ne pas confondre avec le select Zone
       ci-dessus, qui FILTRE. Surligner n'est pas filtrer — les autres zones restent visibles.
       Masqué tant qu'aucune zone n'est chargée (commune non choisie, ou commune sans zone). -->
  @if (showZoneHighlight() && zones().length > 0) {
  <div class="zone-hl">
    <span class="zone-hl__label">{{ 'hierarchy.highlightZones' | transloco }}</span>
    @for (z of zones(); track z.id) {
    <label class="zone-hl__chip" [class.zone-hl__chip--on]="isZoneHighlighted(z.id)">
      <input type="checkbox" [checked]="isZoneHighlighted(z.id)" (change)="toggleZoneHighlight(z.id)" />
      {{ z.name }}
    </label>
    }
    @if (highlightedZones().length > 0) {
    <button type="button" class="zone-hl__clear" (click)="clearZoneHighlight()">{{ 'hierarchy.clearHighlight' | transloco }}</button>
    }
  </div>
  }

  <select class="cascade__select" [disabled]="!selection().cityId" (change)="onQuartier($any($event.target).value)">
    <option value="">{{ 'hierarchy.allQuartiers' | transloco }}</option>
    @for (q of quartiers(); track q.id) {
    <option [value]="q.id" [selected]="q.id === selection().quartierId">{{ q.name }}</option>
    }
  </select>

  <!--
    Le select des closes est TOUJOURS rendu, désactivé quand le quartier n'en a aucune.
    Il était masqué dans ce cas jusqu'au 2026-08-25 : impossible alors de distinguer « ce filtre
    n'existe pas » de « il n'y a rien à filtrer », et comme aucune close n'existe encore, le
    filtre semblait tout simplement absent de l'application.
  -->
  <select class="cascade__select" [disabled]="!selection().quartierId || closes().length === 0"
    (change)="onClose($any($event.target).value)">
    @if (selection().quartierId && closes().length === 0) {
    <option value="">{{ 'hierarchy.noCloses' | transloco }}</option>
    } @else {
    <option value="">{{ 'hierarchy.allCloses' | transloco }}</option>
    @for (c of closes(); track c.id) {
    <option [value]="c.id" [selected]="c.id === selection().closeId">{{ c.name }}</option>
    }
    }
  </select>
</div>
