<div class="cascade">
  <select class="cascade__select" (change)="onCity($any($event.target).value)">
    <option value="">{{ 'hierarchy.allCities' | transloco }}</option>
    @for (c of cities(); track c.id) {
    <option [value]="c.id" [selected]="c.id === selection().cityId">{{ c.name }}</option>
    }
  </select>

  <select class="cascade__select" [disabled]="!selection().cityId" (change)="onCommune($any($event.target).value)">
    <option value="">{{ 'hierarchy.allCommunes' | transloco }}</option>
    @for (c of communes(); track c.id) {
    <option [value]="c.id" [selected]="c.id === selection().communeId">{{ c.name }}</option>
    }
  </select>

  <select class="cascade__select" [disabled]="!selection().communeId" (change)="onZone($any($event.target).value)">
    <option value="">{{ 'hierarchy.allZones' | transloco }}</option>
    @for (z of zones(); track z.id) {
    <option [value]="z.id" [selected]="z.id === selection().zoneId">{{ z.name }}</option>
    }
  </select>

  <select class="cascade__select" [disabled]="!selection().cityId" (change)="onQuartier($any($event.target).value)">
    <option value="">{{ 'hierarchy.allQuartiers' | transloco }}</option>
    @for (q of quartiers(); track q.id) {
    <option [value]="q.id" [selected]="q.id === selection().quartierId">{{ q.name }}</option>
    }
  </select>

  <!--
    Le select des closes est TOUJOURS rendu, désactivé quand le quartier n'en a aucune.
    Il était masqué dans ce cas jusqu'au 2026-08-25 : impossible alors de distinguer « ce filtre
    n'existe pas » de « il n'y a rien à filtrer », et comme aucune close n'existe encore, le
    filtre semblait tout simplement absent de l'application.
  -->
  <select class="cascade__select" [disabled]="!selection().quartierId || closes().length === 0"
    (change)="onClose($any($event.target).value)">
    @if (selection().quartierId && closes().length === 0) {
    <option value="">{{ 'hierarchy.noCloses' | transloco }}</option>
    } @else {
    <option value="">{{ 'hierarchy.allCloses' | transloco }}</option>
    @for (c of closes(); track c.id) {
    <option [value]="c.id" [selected]="c.id === selection().closeId">{{ c.name }}</option>
    }
    }
  </select>
</div>
