map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    # IPv6 aussi : le healthcheck de l'image fait `wget http://localhost/`, et dans le conteneur
    # `localhost` résout d'abord en `::1`. Sans cette ligne, nginx n'écoute qu'en 0.0.0.0 et le
    # healthcheck reçoit « Connection refused » à chaque passage — le conteneur reste UNHEALTHY
    # en permanence alors que le site répond parfaitement depuis l'hôte.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Force le bon type pour les modules ES
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    # Les assets NON HASHÉS gardent la même URL d'un déploiement à l'autre : `config.json`,
    # `assets/map-style.json`, les fichiers i18n. Sans directive de cache, le navigateur applique
    # un cache HEURISTIQUE et continue de servir l'ancienne version — alors que les chunks JS,
    # eux, ont changé de nom et sont donc rechargés. C'est ce décalage qui a fait apparaître la
    # case « Contour national » dans le panneau des couches (bundle neuf) sans la couche sur la
    # carte (style en cache), le 2026-09-02.
    #
    # `no-cache` ne veut PAS dire « ne pas mettre en cache » : le navigateur garde le fichier et
    # revalide à chaque fois. Inchangé = 304 vide, donc rien de perdu côté bande passante.
    location ~* ^/(config\.json|assets/.*\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /tiles/ {
        # Martin renvoie un ETag mais AUCUN `Cache-Control` : le navigateur applique alors son
        # cache heuristique et continue d'afficher les tuiles d'avant un import. Constaté le
        # 2026-09-02 après la reprise des routes OSM — la donnée était en base, servie par
        # Martin, et invisible à l'écran.
        #
        # `no-cache` = garder la tuile mais REVALIDER. Grâce à l'ETag, une tuile inchangée
        # répond 304 sans corps : le coût est un aller-retour, pas un rechargement. C'est le bon
        # compromis pour un back-office ; pour l'API publique, un `max-age` court serait
        # préférable.
        add_header Cache-Control "no-cache" always;

        resolver 127.0.0.11 valid=10s;
        set $martin "http://martin:3000";
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass $martin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend "http://das-backend:5000";
        proxy_pass $backend$request_uri;

        # HTTP/1.1 + en-têtes Upgrade pour WebSocket (SignalR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SignalR : pas de buffering ni de timeout court sur les connexions longues
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
