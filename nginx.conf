server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA Angular — fallback vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers Martin (tuiles vectorielles)
    location /tiles/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy vers le backend .NET (quand il existera) — à décommenter le moment venu
    # location /api/ {
    #     proxy_pass http://das-backend:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
