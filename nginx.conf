map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Force le bon type pour les modules ES
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /tiles/ {
        resolver 127.0.0.11 valid=10s;
        set $martin "http://martin:3000";
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass $martin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend "http://das-backend:5000";
        proxy_pass $backend$request_uri;

        # HTTP/1.1 + en-têtes Upgrade pour WebSocket (SignalR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SignalR : pas de buffering ni de timeout court sur les connexions longues
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
