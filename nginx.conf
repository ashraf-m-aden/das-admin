map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 80;
    # IPv6 aussi : le healthcheck de l'image fait `wget http://localhost/`, et dans le conteneur
    # `localhost` résout d'abord en `::1`. Sans cette ligne, nginx n'écoute qu'en 0.0.0.0 et le
    # healthcheck reçoit « Connection refused » à chaque passage — le conteneur reste UNHEALTHY
    # en permanence alors que le site répond parfaitement depuis l'hôte.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Force le bon type pour les modules ES
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    # Fichiers à URL STABLE, que le build Angular n'empreinte PAS : `index.html`,
    # `config.json` et tout `assets/` (dont `map-style.json` et les `i18n/*.json`).
    #
    # Sans en-tête de cache, nginx n'en envoie aucun et le navigateur applique sa
    # fraîcheur HEURISTIQUE : il garde le fichier des heures sans jamais revalider.
    # Constaté le 2026-09-04 — un `map-style.json` du 28 août servi depuis le cache,
    # sans la couche « Villes » ajoutée le jour même, y compris après Ctrl+Shift+R.
    # Les bundles JS, eux, portent un hash dans leur nom : ils se mettaient bien à
    # jour, ce qui rendait le symptôme incompréhensible — le panneau proposait la
    # couche, le style ne la contenait pas.
    #
    # `no-cache` = mettre en cache MAIS revalider à chaque fois. Avec l'ETag déjà
    # émis, la revalidation coûte un 304 vide.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /config.json {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        add_header Cache-Control "no-cache" always;

        # Le style vitrine (`commercial-style.json` et ses variantes de langue) est consomme par
        # des tiers — La Poste de Djibouti l'affiche dans ses ecrans « Agences ». Un fetch
        # cross-origin sans cet en-tete est bloque par le navigateur du partenaire, et la carte
        # reste vide de son cote sans aucune erreur visible cote serveur.
        #
        # Ce n'est PAS une ouverture des donnees : /assets/ ne sert que des fichiers statiques
        # deja publics (styles, traductions, images). Les tuiles et la recherche, elles, restent
        # derriere une cle — voir /api/public/ plus bas.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Le style commercial, publie AUSSI sous /carto/ — c'est le chemin que la Plateforme 1 de
    # La Poste attend (`styleUrl: '/carto/commercial-style.json'`). Le meme fichier, deux
    # chemins : plutot que d'imposer a l'autre depot de changer son environnement, ou de
    # dupliquer le style, on repond aux deux.
    #
    # ⚠️ `alias` et non `root` : avec `root`, nginx concatenerait le chemin de la requete au
    # dossier et chercherait /usr/share/nginx/html/assets/carto/… qui n'existe pas.
    location /carto/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "no-cache" always;
        # Meme raison qu'au-dessus : c'est PRECISEMENT le chemin cross-origin de La Poste.
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⛔ Le relais direct vers Martin a ete RETIRE le 2026-09-10.
    #
    # Il servait `http://localhost/tiles/<source>/<z>/<x>/<y>` a qui le demandait, sans aucune
    # authentification. Verifie ce jour-la : `/tiles/quartiers_tiles/13/5077/3830` rendait
    # 14 Ko de donnees reelles. Et Martin AUTO-PUBLIE tout ce que son role peut lire — 34 sources,
    # dont `Surveys`, `Units` et `DiscoveryReports`. Le systeme de cles livre la veille en
    # devenait decoratif : pourquoi presenter une cle quand la meme tuile est en libre acces un
    # chemin plus loin ?
    #
    # Les tuiles passent desormais par l'API, qui valide l'appelant :
    #   /api/tiles/...         jeton de session, 14 sources, pour l'administration
    #   /api/public/tiles/...  cle revocable, 5 sources, pour la carte publique et les clients
    #
    # Ne pas retablir ce bloc sans avoir remis une authentification devant.
    #
    # Le chemin est ferme EXPLICITEMENT. Sans ce bloc il retomberait dans le repli SPA et
    # rendrait `200 text/html` pour une tuile : un client verrait un succes et decoderait de
    # l'index.html en protobuf, ce qui echoue sans rien expliquer. 410 dit ce qui s'est passe —
    # la ressource a existe, elle n'existe plus ici.
    location /tiles/ {
        return 410 "Le relais direct vers Martin a ete retire. Utiliser /api/public/tiles/ avec une cle, ou /api/tiles/ avec un jeton de session.\n";
        add_header Content-Type text/plain always;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend "http://das-backend:5000";
        proxy_pass $backend$request_uri;

        # HTTP/1.1 + en-têtes Upgrade pour WebSocket (SignalR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SignalR : pas de buffering ni de timeout court sur les connexions longues
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
