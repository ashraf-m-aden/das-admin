services:
  das-admin:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      API_BASE_URL: "http://localhost:5000"
      TILES_BASE_URL: "http://localhost:3000"
      APP_ENVIRONMENT: "development"
      USE_MOCK_API: "true"   # -> "false" quand l'API .NET /auth/* sera prête
      # COGNITO_USER_POOL_ID / COGNITO_CLIENT_ID à renseigner selon l'environnement
    restart: unless-stopped

  martin:
    image: ghcr.io/maplibre/martin:latest
    ports:
      - "3000:3000"
    volumes:
      - ./docker/martin/config.yaml:/config.yaml:ro
    command: ["--config", "/config.yaml"]
    environment:
      DATABASE_URL: "postgresql://das_user:${DB_PASSWORD}@postgres:5432/das_db"
    depends_on:
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - das_redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: das_db
      POSTGRES_USER: das_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - das_postgres_data:/var/lib/postgresql/data

  das-admin-dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm ci && npm start -- --host 0.0.0.0"
    environment:
      NODE_ENV: development

volumes:
  das_postgres_data:
  das_redis_data:
