services:
  das-admin:
    image: nejishow/das-admin:latest
    container_name: das-admin
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      API_BASE_URL: "/api"
      # ⚠️ Les tuiles ne passent PLUS par Martin en direct. Les deux relais de l'API valident
      # l'appelant — jeton de session pour l'administration, cle pour le public. Martin
      # auto-publie 34 sources, dont les tables du recensement : l'exposer, c'est ouvrir le schema.
      MAP_TILE_URL: "/api/tiles"
      MAP_PUBLIC_TILE_URL: "/api/public/tiles"
      # Cle de la carte publique, delivree depuis l'ecran /cles-api. Publique par nature : elle
      # voyage dans les URL de tuiles. Ce qu'elle apporte est la revocabilite, pas le secret.
      MAP_PUBLIC_KEY: "${MAP_PUBLIC_KEY:-}"
      APP_ENVIRONMENT: "production"
      USE_MOCK_API: "false"
    depends_on:
      - martin
    restart: unless-stopped
    networks: [das-net]


  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: martin
    environment:
      DATABASE_URL: "postgresql://martin_ro:HuVFVEfNfUpOQI1Puc7hfBgszcxO0zCT@host.docker.internal:5433/das?sslmode=require"
    # --pool-size : la base plafonne à max_connections=79 et un Martin v0.11.0 déployé ailleurs
    #   en retient déjà ~56. Le défaut de 20 ne peut donc pas être servi : Martin échoue à
    #   construire son pool, considère l'échec comme FATAL, sort, et `restart: unless-stopped`
    #   le relance en boucle. 5 suffisent largement pour un front d'administration.
    # --auto-bounds skip : le calcul d'emprise déclenche des ST_EstimatedExtent qui retombent sur
    #   une méthode lente, chacune monopolisant une connexion plusieurs secondes au démarrage —
    #   précisément quand les connexions manquent. Les emprises servent au cadrage automatique,
    #   dont ce front ne se sert pas : il cadre lui-même sur la hiérarchie sélectionnée.
    command: ["--pool-size", "5", "--auto-bounds", "skip"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks: [das-net]

  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--appendonly",
        "yes",
      ]
    volumes:
      - das_redis_data:/data
    restart: unless-stopped
    networks: [das-net]

networks:
  das-net:
    external: true
    name: das-shared

volumes:
  das_redis_data:
