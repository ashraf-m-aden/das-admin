services:
  das-admin:
    image: nejishow/das-admin:latest
    container_name: das-admin
    ports:
      - "80:80"
    environment:
      API_BASE_URL: "/api" # nginx proxie vers das-backend
      TILES_BASE_URL: "/tiles" # nginx proxie vers martin
      APP_ENVIRONMENT: "production"
      USE_MOCK_API: "true" # ⚠️ à mettre sur false pour utiliser l'API réelle
    depends_on:
      - das-backend
      - martin
    restart: unless-stopped
    networks: [das-net]

  das-backend:
    image: nejishow/das-backend:latest # ⚠️ à adapter au nom réel de ton image back
    container_name: das-backend
    environment:
      ASPNETCORE_HTTP_PORTS: "8080" # interne au réseau docker, PAS publié sur l'hôte
      ConnectionStrings__Default: "Host=${RDS_HOST};Port=5432;Database=${RDS_DB};Username=${RDS_USER};Password=${RDS_PASSWORD};SSL Mode=Require;Trust Server Certificate=true"
      Redis__Connection: "redis:6379"
    depends_on:
      - redis
    restart: unless-stopped
    networks: [das-net]

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: martin
    volumes:
      - ./docker/martin/config.yaml:/config.yaml:ro
    command: ["--config", "/config.yaml"]
    environment:
      DATABASE_URL: "postgresql://${RDS_USER}:${RDS_PASSWORD}@${RDS_HOST}:5432/${RDS_DB}?sslmode=require"
    restart: unless-stopped
    networks: [das-net]

  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--appendonly",
        "yes",
      ]
    volumes:
      - das_redis_data:/data
    restart: unless-stopped
    networks: [das-net]

networks:
  das-net:
    driver: bridge

volumes:
  das_redis_data:
