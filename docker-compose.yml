services:
  das-admin:
    image: nejishow/das-admin:latest
    container_name: das-admin
    ports:
      - "80:80"
    # L'EC2 tourne en amd64. Le declarer evite qu'une image construite sur un
    # poste ARM soit choisie ici et diverge de ce qui tourne en production.
    platform: linux/amd64
    volumes:
      # `:ro` — ce montage ECRASE la configuration de l'image. C'est par lui que
      # l'EC2 a servi un nginx.conf du 17 aout pendant un mois, pendant que les
      # images se succedaient : reconstruire ne changeait rien. En lecture seule
      # au moins, personne ne le modifie depuis le conteneur.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      API_BASE_URL: "/api"
      # ⚠️ Les tuiles ne passent PLUS par Martin en direct. Les deux relais de l'API valident
      # l'appelant — jeton de session pour l'administration, cle pour le public. Martin
      # auto-publie 34 sources, dont les tables du recensement : l'exposer, c'est ouvrir le schema.
      MAP_TILE_URL: "/api/tiles"
      MAP_PUBLIC_TILE_URL: "/api/public/tiles"
      # Cle de la carte publique, delivree depuis l'ecran /cles-api. Publique par nature : elle
      # voyage dans les URL de tuiles. Ce qu'elle apporte est la revocabilite, pas le secret.
      MAP_PUBLIC_KEY: "${MAP_PUBLIC_KEY:-}"
      APP_ENVIRONMENT: "production"
      USE_MOCK_API: "false"
    depends_on:
      - martin
    restart: unless-stopped
    networks: [das-net]


  # ---------------------------------------------------------------------------
  # Plateforme 1 — Services Clients de La Poste de Djibouti.
  #
  # ⚠️ Elle n'a rien a faire ici sur le fond : c'est un AUTRE depot, un autre
  # produit, une autre equipe. Elle y est parce qu'elle tourne POUR L'INSTANT
  # sur le meme EC2, faute d'une machine a elle — et parce que la poser sur ce
  # reseau est justement ce qui lui permet de joindre D.A.S sans sortir de
  # l'hote. Le jour ou elle demenage, ce bloc s'en va d'un seul tenant.
  #
  # Pas de `build:` — le Dockerfile vit dans le depot `laposte`. Ici on ne fait
  # que TIRER l'image, comme pour `das-admin`.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # L'API .NET. Elle manquait a ce fichier alors qu'elle tourne en production :
  # qui lancait cette composition obtenait une pile SANS API, et une carte sans
  # tuiles — le relais `/api/` de nginx pointant dans le vide.
  #
  # ⚠️ Aucun secret ici. L'EC2 les porte en clair dans son propre compose ; ce
  # depot est PUBLIC et ne peut pas se le permettre. Tout passe par `.env`, que
  # `.env.example` documente.
  # ---------------------------------------------------------------------------
  das-backend:
    image: nejishow/das-backend:latest
    container_name: das-backend
    # Les identifiants AWS que le back utilise pour lire Secrets Manager au
    # demarrage — sans eux, il s'arrete avant d'ecouter.
    env_file: .env
    platform: linux/amd64
    environment:
      ASPNETCORE_HTTP_PORTS: "5000"
      ASPNETCORE_ENVIRONMENT: "Production"
      DB_HOST: "${RDS_HOST}"
      DB_PORT: "5432"
      # ⚠️ `Jwt__Secret` signe les jetons de session. Une valeur devinable rend
      # les jetons FORGEABLES — un jeton admin fabrique hors de chez nous passe
      # toutes les verifications. Ne jamais laisser le gabarit livre avec le
      # projet : il est public par construction.
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "DASApi"
      Jwt__Audience: "DASApiClients"
      Jwt__ExpiryMinutes: "60"
      Jwt__RefreshTokenExpiryDays: "7"
    restart: unless-stopped
    networks: [das-net]

  das-laposte:
    image: nejishow/das-laposte:latest
    container_name: das-laposte
    ports:
      # Pas 80 : `das-admin` le tient. Tant que la Plateforme 1 n'a pas son
      # propre nom d'hote, elle se joint sur :8080. Surchargeable, parce que
      # 8080 est un port dispute et qu'un conflit se lit « address already in
      # use » au demarrage, sans dire qui le tient.
      - "${LAPOSTE_PORT:-81}:80"
    environment:
      # Le nginx de cette image tient le role du back-end postal pour le fond de
      # carte : c'est LUI qui presente `X-DAS-Key` sur `/tiles`, parce que le
      # navigateur ne le peut pas — MapLibre construit ses URL de tuiles et
      # n'accepte aucun en-tete.
      #
      # `das-admin` et non `carte.das.dj` : meme hote, meme reseau Docker, le
      # trafic des tuiles ne sort pas de la machine. Au demenagement, cette
      # ligne ET DAS_RESOLVER changent ensemble — 127.0.0.11 ne resout que des
      # noms de conteneurs, pas un nom public.
      DAS_ORIGIN: "${DAS_ORIGIN:-http://das-admin}"
      DAS_RESOLVER: "${DAS_RESOLVER:-127.0.0.11}"

      # Cle de RECETTE `das_paQjiHPR`, distincte de `das_SEjertCf` qui est celle
      # de leur PRODUCTION : une revocation de test ne coupe pas La Poste.
      # Absente, le style se charge et les tuiles rendent 401 — le conteneur le
      # dit au demarrage plutot que de laisser chercher pourquoi c'est blanc.
      DAS_KEY: "${LAPOSTE_DAS_KEY:-}"
    depends_on:
      - das-admin
    restart: unless-stopped
    networks: [das-net]

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: martin
    environment:
      # ⚠️ Compose depuis `.env`, JAMAIS en dur. Ce fichier a porte le mot de
      # passe du role Martin en clair du 2026-08-30 au 2026-09-15, sur un depot
      # PUBLIC. Le retirer ne desexpose rien — l'historique le garde ; c'est la
      # ROTATION qui compte. Ceci empeche la suite.
      DATABASE_URL: "postgresql://${RDS_USER}:${RDS_PASSWORD}@${RDS_HOST}:5432/${RDS_DB}?sslmode=require"
    # NOTE tunnel : `host.docker.internal:5433` suppose que le tunnel SSH vers la base écoute sur
    #   TOUTES les interfaces de l'hôte. Un tunnel ouvert en `-L 5433:...` ne se lie qu'à
    #   127.0.0.1 : le conteneur reçoit alors « Connection refused » et Martin redémarre en boucle
    #   (constaté le 2026-09-09). Ouvrir le tunnel avec `-L 0.0.0.0:5433:...` (ou pointer
    #   DATABASE_URL sur l'hôte RDS directement) règle le problème.
    #
    # `--config` : sans lui, Martin part en auto-détection et publie TOUTES les tables
    #   géométriques de la base — 34 sources au relevé, dont `Surveys`, `Units` et
    #   `DiscoveryReports`, qui n'ont rien à faire dans un fond de carte. Le fichier monté
    #   ci-dessous fixe la liste exacte, et porte aussi `pool_size: 5` (la base plafonne à
    #   max_connections=79 et un autre Martin en retient déjà ~56 : le défaut de 20 ne peut pas
    #   être servi, Martin considère l'échec comme FATAL, sort, et `restart: unless-stopped` le
    #   relance en boucle).
    # `--auto-bounds skip` : les emprises sont déclarées dans le fichier, inutile de payer des
    #   ST_EstimatedExtent au démarrage — chacun monopolise une connexion plusieurs secondes,
    #   précisément quand les connexions manquent.
    command: ["--config", "/config.yaml", "--auto-bounds", "skip"]
    volumes:
      - ./docker/martin/config.yaml:/config.yaml:ro
    # ⚠️ Aucun `ports:` ici, VOLONTAIREMENT. Martin n'est joignable que depuis le réseau Docker,
    # et c'est l'API qui sert les tuiles en validant l'appelant (`/api/tiles` sous jeton,
    # `/api/public/tiles` sous clé). Publier 3000 sur l'hôte rouvrirait en clair ce que la
    # fermeture de `/tiles/` a fermé le 2026-09-10 — et la liste du fichier de config ne suffit
    # pas : elle restreint ce que Martin publie, pas qui peut le lui demander.
    # Pour du `ng serve` local, publier 3000 dans un override de développement.
    restart: unless-stopped
    networks: [das-net]

  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--appendonly",
        "yes",
      ]
    volumes:
      - das_redis_data:/data
    restart: unless-stopped
    networks: [das-net]

networks:
  das-net:
    external: true
    name: das-shared

volumes:
  das_redis_data:
