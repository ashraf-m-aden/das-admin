services:
  das-admin:
    image: nejishow/das-admin:latest
    container_name: das-admin
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      API_BASE_URL: "/api"
      # ⚠️ Les tuiles ne passent PLUS par Martin en direct. Les deux relais de l'API valident
      # l'appelant — jeton de session pour l'administration, cle pour le public. Martin
      # auto-publie 34 sources, dont les tables du recensement : l'exposer, c'est ouvrir le schema.
      MAP_TILE_URL: "/api/tiles"
      MAP_PUBLIC_TILE_URL: "/api/public/tiles"
      # Cle de la carte publique, delivree depuis l'ecran /cles-api. Publique par nature : elle
      # voyage dans les URL de tuiles. Ce qu'elle apporte est la revocabilite, pas le secret.
      MAP_PUBLIC_KEY: "${MAP_PUBLIC_KEY:-}"
      APP_ENVIRONMENT: "production"
      USE_MOCK_API: "false"
    depends_on:
      - martin
    restart: unless-stopped
    networks: [das-net]


  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: martin
    environment:
      DATABASE_URL: "postgresql://martin_ro:HuVFVEfNfUpOQI1Puc7hfBgszcxO0zCT@host.docker.internal:5433/das?sslmode=require"
    # NOTE tunnel : `host.docker.internal:5433` suppose que le tunnel SSH vers la base écoute sur
    #   TOUTES les interfaces de l'hôte. Un tunnel ouvert en `-L 5433:...` ne se lie qu'à
    #   127.0.0.1 : le conteneur reçoit alors « Connection refused » et Martin redémarre en boucle
    #   (constaté le 2026-09-09). Ouvrir le tunnel avec `-L 0.0.0.0:5433:...` (ou pointer
    #   DATABASE_URL sur l'hôte RDS directement) règle le problème.
    #
    # `--config` : sans lui, Martin part en auto-détection et publie TOUTES les tables
    #   géométriques de la base — 34 sources au relevé, dont `Surveys`, `Units` et
    #   `DiscoveryReports`, qui n'ont rien à faire dans un fond de carte. Le fichier monté
    #   ci-dessous fixe la liste exacte, et porte aussi `pool_size: 5` (la base plafonne à
    #   max_connections=79 et un autre Martin en retient déjà ~56 : le défaut de 20 ne peut pas
    #   être servi, Martin considère l'échec comme FATAL, sort, et `restart: unless-stopped` le
    #   relance en boucle).
    # `--auto-bounds skip` : les emprises sont déclarées dans le fichier, inutile de payer des
    #   ST_EstimatedExtent au démarrage — chacun monopolise une connexion plusieurs secondes,
    #   précisément quand les connexions manquent.
    command: ["--config", "/config.yaml", "--auto-bounds", "skip"]
    volumes:
      - ./docker/martin/config.yaml:/config.yaml:ro
    # ⚠️ Aucun `ports:` ici, VOLONTAIREMENT. Martin n'est joignable que depuis le réseau Docker,
    # et c'est l'API qui sert les tuiles en validant l'appelant (`/api/tiles` sous jeton,
    # `/api/public/tiles` sous clé). Publier 3000 sur l'hôte rouvrirait en clair ce que la
    # fermeture de `/tiles/` a fermé le 2026-09-10 — et la liste du fichier de config ne suffit
    # pas : elle restreint ce que Martin publie, pas qui peut le lui demander.
    # Pour du `ng serve` local, publier 3000 dans un override de développement.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks: [das-net]

  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--appendonly",
        "yes",
      ]
    volumes:
      - das_redis_data:/data
    restart: unless-stopped
    networks: [das-net]

networks:
  das-net:
    external: true
    name: das-shared

volumes:
  das_redis_data:
