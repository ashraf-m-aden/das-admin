services:
  das-admin:
    image: nejishow/das-admin:latest
    container_name: das-admin
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      API_BASE_URL: "/api"
      MAP_TILE_URL: "/tiles"
      APP_ENVIRONMENT: "production"
      USE_MOCK_API: "false"
    depends_on:
      - martin
    restart: unless-stopped
    networks: [das-net]


  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: martin
    environment:
      DATABASE_URL: "postgresql://postgres:kfYy%3C1GsD0Jt%29%23Fn%3EEs%28%5BZYJoQLY@host.docker.internal:5433/das?sslmode=require"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks: [das-net]

  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--appendonly",
        "yes",
      ]
    volumes:
      - das_redis_data:/data
    restart: unless-stopped
    networks: [das-net]

networks:
  das-net:
    external: true
    name: das-shared

volumes:
  das_redis_data:
